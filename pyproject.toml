[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-ai-agent"
version = "0.1.0"
description = "Safety-first hourly Gmail classifier, draft assistant, and digest generator"
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client>=2.160.0",
  "google-auth-oauthlib>=1.2.1",
  "openai>=1.61.0",
  "pydantic[email]>=2.10.0",
  "pydantic-settings>=2.7.0",
  "filelock>=3.17.0",
  "requests>=2.32.0",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.9", "mypy>=1.14", "types-filelock"]

[project.scripts]
gmail-ai-agent = "gmail_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gmail_agent"]
ignore_missing_imports = true
